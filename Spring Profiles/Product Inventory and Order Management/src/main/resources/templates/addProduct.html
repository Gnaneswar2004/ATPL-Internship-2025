<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>
</head>
<body>
<h2>Add New Product</h2>

<form th:action="@{/products/add}" method="post" th:object="${product}">
    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required/><br/><br/>

    <label>Quantity:</label>
    <input type="number" th:field="*{stock}" min="1" required/><br/><br/>

    <button type="submit">Add Product</button>
</form>

<hr/>
<h3>Products List</h3>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Quantity</th>
    </tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td>
    </tr>
</table>

<a th:href="@{/}">Back to Home</a>
</body>
</html>
