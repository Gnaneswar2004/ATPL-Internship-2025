<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Product</title>
</head>
<body>
<h2>Update Product</h2>

<form th:action="@{/products/update}" method="post" th:object="${product}">
    <label>Product ID:</label>
    <input type="number" th:field="*{id}" readonly/><br/><br/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Quantity:</label>
    <input type="number" th:field="*{quantity}" min="0" required/><br/><br/>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required/><br/><br/>

    <button type="submit">Update Product</button>
</form>

<hr/>

<h3>All Products</h3>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Stock</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.stock}"></td>
            <td th:text="${p.price}"></td>
        </tr>
    </tbody>
</table>

<a href="/products/list">Back to Products</a>
</body>
</html>
