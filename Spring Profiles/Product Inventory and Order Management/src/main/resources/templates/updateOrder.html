<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Order</title>
</head>
<body>
<h2>Update Order</h2>

<form th:action="@{/orders/update}" method="post" th:object="${order}">
    <label>Order ID:</label>
    <input type="number" th:field="*{id}" readonly/><br/><br/>

    <label>Product:</label>
    <select th:field="*{product.id}" required>
        <option th:each="p : ${products}" 
                th:value="${p.id}" 
                th:text="${p.name}" 
                th:selected="${p.id} == ${order.product.id}">
        </option>
    </select><br/><br/>

    <label>Quantity:</label>
    <input type="number" th:field="*{quantity}" min="1" required/><br/><br/>

    <button type="submit">Update Order</button>
</form>

<hr/>

<h3>All Orders</h3>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${o.product.name}"></td>
            <td th:text="${o.quantity}"></td>
            <td th:text="${o.status}"></td>
        </tr>
    </tbody>
</table>

<a href="/orders/list">Back to Orders</a>
</body>
</html>
