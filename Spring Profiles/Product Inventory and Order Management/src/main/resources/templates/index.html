<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Inventory and Order Management - Home</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { color: #333; }
        .section { margin-bottom: 30px; }
        .buttons a {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .buttons a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h1>Product Inventory and Order Management</h1>

<div class="section">
    <h2>Orders</h2>
    <div class="buttons">
        <a th:href="@{/orders/add}">Add Order</a>
        <a th:href="@{/orders/update}">Update Order</a>
        <a th:href="@{/orders/list}">View Orders</a>
    </div>
</div>

<div class="section">
    <h2>Products</h2>
    <div class="buttons">
        <a th:href="@{/products/add}">Add Product</a>
        <a th:href="@{/products/update}">Update Product</a>
        <a th:href="@{/products/list}">View Products</a>
    </div>
</div>

</body>
</html>
