<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Navigation Bar with Flexbox</title>
    <style>
        body {
            margin: 0px;
        }
        .flex-container {
            padding: 10px;
            display: flex;
            justify-content: space-evenly;
            background-color: #000000d0;
        }
        .flex-container a {
            color: aliceblue;
            text-decoration: none;
            padding: 10px 15px;
        }
        .flex-container a:hover {
            background-color: grey;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </div>
</body>
</html>
