<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Slider</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #slider { width: 400px; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    #slides { display: flex; transition: transform 0.5s; }
    img { width: 400px; height: 250px; object-fit: cover; }
    button {
      margin: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Image Slider</h2>
  <div id="slider">
    <div id="slides">
      <img src="https://picsum.photos/id/1015/400/250" alt="slide1">
      <img src="https://picsum.photos/id/1016/400/250" alt="slide2">
      <img src="https://picsum.photos/id/1018/400/250" alt="slide3">
    </div>
  </div>
  <div>
    <button onclick="prev()">Prev</button>
    <button onclick="next()">Next</button>
  </div>

  <script>
    let index = 0;
    const slides = document.getElementById('slides');
    const total = slides.children.length;

    function show() {
      slides.style.transform = `translateX(${-index * 400}px)`;
    }
    function next() { index = (index + 1) % total; show(); }
    function prev() { index = (index - 1 + total) % total; show(); }

    setInterval(next, 3000); // autoplay
  </script>
</body>
</html>
