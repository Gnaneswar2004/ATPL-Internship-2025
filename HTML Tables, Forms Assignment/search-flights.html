<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Flights</title>
</head>
<body>
    <h2>Search Flights</h2>
    <p>Please Enter the below details</p>
    <form>
        <label>From:</label>
        <input type = "text" name = "Start" placeholder = "Start" required><br><br>

        <label>To:</label>
        <input type = "text" name = "Destination" placeholder = "Destination" required><br><br>

        <label>Departure Date:</label>
        <input type = "date" name = "Departure Date" required><br><br>

        <label>Return Date:</label>
        <input type = "date" name = "Return Date" required><br><br>

        <label>Passenger:</label>
        <select name = "Passenger" required>
            <option value = "">select</option>
            <option value = "Adults">Adults</option>
            <option value = "Children">Children</option>
        </select><br><br>

        <input type = "submit">
    </form>
</body>
</html>
