<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <p>Please fill the below details</p>
    <form>
        <label>First Name</label>
        <input type = "text" placeholder = "Enter your First Name" required><br><br>

        <label>Last Name</label>
        <input type = "text" placeholder = "Enter your Last Name" required><br><br>

        <label>Email</label>
        <input type = "email" placeholder = "Enter your Email" required><br><br>

        <label>Date of Birth</label>
        <input type = "date" required><br><br>

        <label>Age</label>
        <input type = "number" min = "18" max = "100" required><br><br>

        <label>Set Username</label>
        <input type = "text" placeholder = "Enter Username" required><br><br>

        <label>Set Password</label>
        <input type = "password" placeholder = "Enter Password" required><br><br>

        <label>Gender</label>
        <input type = "radio" name = "Gender" value = "Male">Male
        <input type = "radio" name = "Gender" value = "Female">Female
        <input type = "radio" name = "Gender" value = "Others">Others<br><br>

        <label>Course</label>
        <select required>
            <option value = "">Course</option>
            <option value = "B.Tech">B.Tech</option>
            <option value = "B.Sc">B.Sc</option>
            <option value = "B.Com">B.Com</option>
            <option value = "B.A">B.A</option>
        </select><br><br>
        <input type = "submit">
    </form>
</body>
</html>
