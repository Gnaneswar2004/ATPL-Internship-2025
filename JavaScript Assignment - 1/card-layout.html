<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 80%;
      max-width: 800px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h3 {
      margin: 0;
      color: #007BFF;
    }
    .card p {
      margin: 5px 0;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container" id="userCards"></div>

  <script>
    const users = [
      { name: "John", age: 25 },
      { name: "Rita", age: 22 },
      { name: "Sam", age: 30 }
    ];

    const container = document.getElementById("userCards");

    users.forEach(user => {
      let card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${user.name}</h3>
        <p>Age: ${user.age}</p>
      `;

      container.appendChild(card);
    });
  </script>
</body>
</html>
