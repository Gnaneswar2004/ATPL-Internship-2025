<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <style>
    .pricing {
      text-align: center;
    }
    .plan {
      display: inline-block;
      width: 200px;
      border: 1px solid #ccc;
      margin: 10px;
      padding: 15px;
    }
    .plan h3 {
      margin: 10px 0;
    }
    .plan p {
      font-size: 18px;
      color: green;
      font-weight: bold;
    }
    .plan ul {
      list-style: none;
      padding: 0;
    }
    .plan ul li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="pricing">
    <div class="plan">
      <h3>Basic</h3>
      <p>$10</p>
      <ul>
        <li>Feature 1</li>
        <li>Feature 2</li>
      </ul>
    </div>
    <div class="plan">
      <h3>Standard</h3>
      <p>$20</p>
      <ul>
        <li>Feature 1</li>
        <li>Feature 2</li>
        <li>Feature 3</li>
      </ul>
    </div>
    <div class="plan">
      <h3>Premium</h3>
      <p>$30</p>
      <ul>
        <li>Feature 1</li>
        <li>Feature 2</li>
        <li>Feature 3</li>
        <li>Feature 4</li>
      </ul>
    </div>
  </div>
</body>
</html>
