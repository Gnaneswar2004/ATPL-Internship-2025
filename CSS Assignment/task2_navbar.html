<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar</title>
  <style>
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: #333;
      overflow: hidden;
    }
    li {
      float: left;
    }
    li a {
      display: block;
      padding: 14px 20px;
      color: #fff;
      text-decoration: none;
    }
    li a:hover {
      background: #575757;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</body>
</html>
