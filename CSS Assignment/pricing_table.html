<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <style>
        .price {
            text-align: center;
        }
        .plan {
            display: inline-block;
            width: 150px;
            margin: 10px;
            padding: 10px;
            border: 3px solid black;
            border-radius: 20px;
            background-color: #dbdbdb;
        }
        .plan h3 {
            margin: 10px;
        }
        .plan p {
            margin: 10px;
        }
        .plan ul li {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="price">
        <div class="plan">
            <h3>Basic</h3>
            <p><b>$9</b>/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
            </ul>
        </div>
        <div class="plan">
            <h3>Standard</h3>
            <p><b>$19</b>/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
            </ul>
        </div>
        <div class="plan">
            <h3>Premium</h3>
            <p><b>$29</b>/month</p>
            <ul>
                <li>All Features</li>
            </ul>
        </div>
    </div>
</body>
</html>
