<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <style>
    .card {
      width: 300px;
      margin: 50px auto;
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .card img {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 10px 0;
    }
    .card p {
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }
    .card button {
      padding: 10px 20px;
      border: none;
      background: blue;
      color: #fff;
      cursor: pointer;
    }
    .card button:hover {
      background: darkblue;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Product">
    <h3>Sample Product</h3>
    <p>$25.00</p>
    <button>Buy Now</button>
  </div>
</body>
</html>
