<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Layout</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            margin: 50px auto;
            text-align: center;
            border: 5px solid #808080;
            border-radius: 20px;
            box-shadow: 15px 20px 20px #b4b4b4;
        }
        .card img {
            max-width: 100%;
        }
        .card h3 {
            margin: 10px;
        }
        .card p {
            margin: 10px;
        }
        .card button {
            padding: 10px;
            border: none;
            background: #64fa1e;
            cursor: pointer;
        }
        .card button:hover {
            background: #64fa1e8a;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://exstatic-in.iqoo.com/Oz84QB3Wo0uns8j1/in/1749209847020/be3f23783549dc9019de33e69223552c.png.webp" alt="Iqoo Neo 10">
        <h3>Iqoo Neo 10</h3>
        <p><b>44,000</b>/-</p>
        <button>Buy Now</button>
    </div>
</body>
</html>
