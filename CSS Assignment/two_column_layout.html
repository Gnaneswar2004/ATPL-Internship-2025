<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Column Layout Without Flexbox/Grid</title>
    <style>
        .column {
            width: 90%;
            margin: 20px auto;
            border: 2px solid #000000;
        }
        .left {
            float: left;
            width: 25%;
            padding: 15px;
            text-align: center;
            background: #cccccc;
            border-right: 2px solid #000000;
        }
        .right {
            width: 96.5%;
            padding: 15px;
            text-align: center;
            background: #888888;
        }
        .class::after {
            content: "";
            display: block;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="column">
        <div class="left">Left Column</div>
        <div class="right">Main Column</div>
    </div>
</body>
</html>
